spring.application.name=authentication-service

server.port=9000

#########  DB config  ##########
spring.datasource.url=jdbc:mysql://localhost:3308/dev
spring.datasource.username=sovon9
spring.datasource.password=password

#spring data jpa config
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# This server acts as a authentication server exposing /uaa/oauth/token and token_key
#server.servlet.context-path=/uaa

logging.level.org.springframework.security=DEBUG
server.servlet.session.tracking-modes=cookie

# Default seeded user — created on first startup if not already present
# Override these via env vars in production (e.g. APP_DEFAULT-USER_PASSWORD)
app.default-user.username=admin
app.default-user.password=admin
app.default-user.role=ROLE_ADMIN

#gateway
app.gateway.public-url=${PUBLIC_GATEWAY_URL:http://localhost:8888}

spring.security.oauth2.authorizationserver.issuer=${app.gateway.public-url}/auth-service
server.servlet.session.cookie.name=AUTHSESSIONID

eureka.instance.prefer-ip-address=false